# Kariyer Otonomu teması: beyaz, ferah, modern çizgiler; tek canlı vurgu rengi
[theme]
base = "light"
primaryColor = "#0A66FF"            # canlı mavi
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6FA"
textColor = "#0F172A"
linkColor = "#0A66FF"
borderColor = "#E5E8EF"
showWidgetBorder = true
baseRadius = "10px"
font = "'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif"
headingFont = "'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif"
headingFontWeights = [800, 700, 700, 700, 700, 700]

[client]
toolbarMode = "minimal"   # sağ üstteki "Deploy" düğmesi gizli

[server]
address = "localhost"     # yalnızca bu bilgisayardan erişilir (CV ve kişisel veriler içerir)
